apiVersion: v1
kind: ConfigMap
metadata:
  name: dograh-inference-routes
  namespace: dograh
data:
  LOCAL_INFERENCE_ROUTES: |
    {
      "llm": {
        "url": "http://dograh-vllm.dograh-inference.svc.cluster.local:8000/v1",
        "provider": "speaches",
        "default_model": "llama3",
        "timeout_seconds": 120
      },
      "stt": {
        "url": "http://dograh-whisper.dograh-inference.svc.cluster.local:9000",
        "provider": "speaches",
        "default_model": "whisper-large-v3",
        "timeout_seconds": 60
      },
      "tts": {
        "url": "http://dograh-tts.dograh-inference.svc.cluster.local:5000",
        "provider": "speaches",
        "default_model": "piper-en",
        "timeout_seconds": 30
      }
    }
