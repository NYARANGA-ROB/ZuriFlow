apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dograh

resources:
  - ../base

patches:
  - path: ingress-host.patch.yaml
  - path: replicas.patch.yaml

images:
  - name: dograh-api
    newTag: production
  - name: dograh-worker
    newTag: production
  - name: dograh-ui
    newTag: production
