apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dograh-redis
  namespace: dograh
spec:
  serviceName: dograh-redis
  replicas: 1
  selector:
    matchLabels:
      app: dograh-redis
  template:
    metadata:
      labels:
        app: dograh-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dograh-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dograh-redis
  namespace: dograh
spec:
  selector:
    app: dograh-redis
  ports:
    - port: 6379
