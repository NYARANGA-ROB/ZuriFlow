apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dograh-api
  namespace: dograh
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dograh
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /api/v1/realtime-observability/metrics
      interval: 30s
