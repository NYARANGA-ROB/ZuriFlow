apiVersion: apps/v1
kind: Deployment
metadata:
  name: dograh-api
  namespace: dograh
  labels:
    app.kubernetes.io/name: dograh
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dograh
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dograh
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: dograh-api
          command: ["./scripts/entrypoints/k8s-api.sh"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dograh-config
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dograh-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dograh-secrets
                  key: REDIS_URL
            - name: OSS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dograh-secrets
                  key: OSS_JWT_SECRET
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/realtime-observability/health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
