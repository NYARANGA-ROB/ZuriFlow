apiVersion: batch/v1
kind: Job
metadata:
  name: dograh-migrate
  namespace: dograh
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: dograh-api
          command: ["./scripts/entrypoints/k8s-migrate.sh"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dograh-secrets
                  key: DATABASE_URL
