# Copy to secret.yaml and fill values — never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: dograh-secrets
  namespace: dograh
type: Opaque
stringData:
  OSS_JWT_SECRET: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  REDIS_PASSWORD: REPLACE_ME
  DATABASE_URL: postgresql+asyncpg://postgres:REPLACE_ME@dograh-postgresql:5432/postgres
  REDIS_URL: redis://:REPLACE_ME@dograh-redis:6379
