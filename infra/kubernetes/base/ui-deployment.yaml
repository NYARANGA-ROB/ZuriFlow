apiVersion: apps/v1
kind: Deployment
metadata:
  name: dograh-ui
  namespace: dograh
  labels:
    app.kubernetes.io/name: dograh
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dograh
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dograh
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: dograh-ui
          ports:
            - containerPort: 3010
              name: http
          env:
            - name: PORT
              value: "3010"
            - name: BACKEND_URL
              value: http://dograh-api:8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
