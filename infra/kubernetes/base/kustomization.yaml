apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dograh

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  - ingress.yaml
  - hpa-api.yaml
  - hpa-worker.yaml
  - migration-job.yaml
  - postgresql-statefulset.yaml
  - redis-statefulset.yaml
  - servicemonitor.yaml
  - gpu-worker-deployment.yaml

commonLabels:
  app.kubernetes.io/part-of: dograh
  app.kubernetes.io/managed-by: kustomize

images:
  - name: dograh-api
    newName: ghcr.io/dograh/dograh-api
    newTag: latest
  - name: dograh-worker
    newName: ghcr.io/dograh/dograh-worker
    newTag: latest
  - name: dograh-ui
    newName: ghcr.io/dograh/dograh-ui
    newTag: latest
