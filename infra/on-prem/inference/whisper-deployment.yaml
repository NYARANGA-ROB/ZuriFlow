# Faster-Whisper HTTP server for on-prem STT.
# Image: swap for your approved internal build in air-gapped environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dograh-whisper
  namespace: dograh-inference
  labels:
    app.kubernetes.io/name: dograh-whisper
    app.kubernetes.io/component: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dograh-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dograh-whisper
        app.kubernetes.io/component: stt
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: whisper
          # Replace with mirrored image: registry.internal:5000/dograh/faster-whisper-server:1.0
          image: fedirz/faster-whisper-server:latest-cuda
          env:
            - name: WHISPER_MODEL
              value: large-v3
            - name: WHISPER_DEVICE
              value: cuda
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dograh-whisper
  namespace: dograh-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dograh-whisper
  ports:
    - name: http
      port: 9000
      targetPort: http
