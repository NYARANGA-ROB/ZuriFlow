# External Secrets Operator — sync Vault secrets into dograh namespace.
# Install ESO controller separately: https://external-secrets.io
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: dograh
spec:
  provider:
    vault:
      server: "https://vault.corp.internal:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: dograh
          serviceAccountRef:
            name: dograh
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dograh-app-secrets
  namespace: dograh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: dograh-onprem-secrets
    creationPolicy: Owner
  data:
    - secretKey: OSS_JWT_SECRET
      remoteRef:
        key: dograh/production
        property: oss_jwt_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: dograh/production
        property: postgres_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: dograh/production
        property: redis_password
    - secretKey: DATABASE_URL
      remoteRef:
        key: dograh/production
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: dograh/production
        property: redis_url
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: dograh/production
        property: minio_access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: dograh/production
        property: minio_secret_key
