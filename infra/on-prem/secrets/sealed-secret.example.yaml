# Sealed Secrets example — encrypt with kubeseal before committing.
# Controller: https://github.com/bitnami-labs/sealed-secrets
#
# kubeseal --format yaml < secret.plain.yaml > sealed-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dograh-onprem-secrets
  namespace: dograh
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    # Replace with output from kubeseal on your cluster
    OSS_JWT_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    POSTGRES_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    REDIS_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    DATABASE_URL: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    REDIS_URL: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
  template:
    metadata:
      name: dograh-onprem-secrets
      namespace: dograh
    type: Opaque
