apiVersion: v1
kind: Service
metadata:
  name: {{ include "dograh.fullname" . }}-api
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "dograh.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
