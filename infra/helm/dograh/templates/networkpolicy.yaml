{{- if .Values.onPrem.tenantNetworkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dograh.fullname" . }}-api
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dograh.api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dograh.fullname" . }}-worker
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dograh.worker.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
