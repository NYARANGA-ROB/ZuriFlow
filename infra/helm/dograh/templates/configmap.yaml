apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dograh.fullname" . }}-config
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  BACKEND_API_ENDPOINT: https://{{ (index .Values.ingress.hosts 0).host }}
  MINIO_ENDPOINT: {{ include "dograh.fullname" . }}-minio:9000
  MINIO_PUBLIC_ENDPOINT: https://{{ (index .Values.ingress.hosts 0).host }}
