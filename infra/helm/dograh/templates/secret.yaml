{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dograh.fullname" . }}-secrets
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
type: Opaque
stringData:
  OSS_JWT_SECRET: {{ .Values.secrets.ossJwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  DATABASE_URL: {{ include "dograh.databaseUrl" . | quote }}
  REDIS_URL: {{ include "dograh.redisUrl" . | quote }}
{{- end }}
