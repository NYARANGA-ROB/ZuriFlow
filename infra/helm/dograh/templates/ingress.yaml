{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dograh.fullname" . }}
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .service "api" }}{{ include "dograh.fullname" $ }}-api{{ else }}{{ include "dograh.fullname" $ }}-ui{{ end }}
                port:
                  number: {{ if eq .service "api" }}{{ $.Values.api.port }}{{ else }}{{ $.Values.ui.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
