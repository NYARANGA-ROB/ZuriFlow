apiVersion: v1
kind: Service
metadata:
  name: {{ include "dograh.fullname" . }}-ui
  labels:
    {{- include "dograh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "dograh.ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
